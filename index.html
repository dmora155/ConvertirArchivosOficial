<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión STL/GLB a GLB/USDZ</title>

    <!-- Cargar Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Cargar STLLoader, GLTFLoader y los exportadores -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/exporters/USDZExporter.js"></script>

    <!-- Cargar dependencias necesarias para USDZ -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

</head>
<body>
    <h1>Conversión de STL/GLB a GLB/USDZ</h1>
    <p>Selecciona un archivo STL o GLB y conviértelo automáticamente a GLB y USDZ.</p>

    <div>
        <input type="file" id="model-file" accept=".stl,.glb">
        <button onclick="processModel()">Convertir</button>
    </div>

    <script>
        function processModel() {
            const fileInput = document.getElementById('model-file');
            const file = fileInput.files[0];

            if (!file) {
                alert("Por favor, selecciona un archivo STL o GLB.");
                return;
            }

            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.stl')) {
                processSTL(file);
            } else if (fileName.endsWith('.glb')) {
                processGLB(file);
            } else {
                alert("Formato no soportado. Usa STL o GLB.");
            }
        }

        function processSTL(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(event.target.result);
                const material = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const mesh = new THREE.Mesh(geometry, material);

                // Aplicar escala
                const scaleFactor = detectScale(mesh);
                mesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

                console.log(`Archivo STL procesado con factor de escala: ${scaleFactor}`);
                exportGLB(mesh);
            };
            reader.readAsArrayBuffer(file);
        }

        function processGLB(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const loader = new THREE.GLTFLoader();
                loader.parse(event.target.result, '', function(gltf) {
                    const scene = gltf.scene;

                    // Ajustar escala si es necesario
                    const scaleFactor = detectScale(scene);
                    scene.scale.set(scaleFactor, scaleFactor, scaleFactor);

                    console.log(`Archivo GLB procesado con factor de escala: ${scaleFactor}`);
                    exportUSDZ(scene);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function detectScale(model) {
            const boundingBox = new THREE.Box3().setFromObject(model);
            const size = boundingBox.getSize(new THREE.Vector3());
            const maxDimension = Math.max(size.x, size.y, size.z);

            if (maxDimension > 1000) return 0.001; // mm a metros
            if (maxDimension > 100) return 0.01; // cm a metros
            return 1; // Ya está en metros
        }

        function exportGLB(model) {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(model, function(gltf) {
                const blob = new Blob([gltf], { type: "model/gltf-binary" });
                const url = URL.createObjectURL(blob);

                // Crear enlace de descarga
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'modelo_convertido.glb';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                alert("Modelo GLB exportado correctamente.");
                
                // Proceder a convertir a USDZ
                exportUSDZ(model);
            }, { binary: true });
        }

        function exportUSDZ(model) {
            const exporter = new THREE.USDZExporter();
            exporter.parse(model).then(function (arraybuffer) {
                const blob = new Blob([arraybuffer], { type: "model/vnd.usdz+zip" });
                const url = URL.createObjectURL(blob);

                // Crear enlace de descarga
                const downloadLink = document.createElement("a");
                downloadLink.href = url;
                downloadLink.download = "modelo_convertido.usdz";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                alert("Modelo USDZ exportado correctamente.");
            }).catch(function (error) {
                console.error("Error al exportar a USDZ:", error);
                alert("Error al convertir a USDZ. Revisa la consola.");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión STL/GLB a USDZ</title>

    <!-- Cargar Three.js y dependencias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/exporters/USDZExporter.js"></script>
</head>
<body>
    <h1>Conversión de STL o GLB a GLB y USDZ</h1>
    <p>Selecciona un archivo STL o GLB y conviértelo.</p>
    
    <input type="file" id="file-input" accept=".stl,.glb">
    <button onclick="processFile()">Convertir</button>
    
    <script>
        function processFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!file) {
                alert("Por favor, selecciona un archivo STL o GLB.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const extension = file.name.split('.').pop().toLowerCase();
                if (extension === 'stl') {
                    convertSTLtoGLB(event.target.result);
                } else if (extension === 'glb') {
                    convertGLBtoUSDZ(event.target.result);
                } else {
                    alert("Formato no compatible.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function convertSTLtoGLB(arrayBuffer) {
            const loader = new THREE.STLLoader();
            const geometry = loader.parse(arrayBuffer);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);

            const boundingBox = new THREE.Box3().setFromObject(mesh);
            const size = boundingBox.getSize(new THREE.Vector3());
            let scaleFactor = size.y > 100 ? 0.01 : (size.y > 10 ? 0.1 : 1);
            mesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

            exportGLB(mesh);
        }

        function exportGLB(model) {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(model, function (gltf) {
                const blob = new Blob([gltf], { type: "model/gltf-binary" });
                const url = URL.createObjectURL(blob);
                downloadFile(url, 'modelo_convertido.glb');
                convertGLBtoUSDZ(blob);
            }, { binary: true });
        }

        function convertGLBtoUSDZ(arrayBuffer) {
            const loader = new THREE.GLTFLoader();
            loader.parse(arrayBuffer, '', function(gltf) {
                const scene = gltf.scene;
                const scaleFactor = detectScale(scene);
                scene.scale.set(scaleFactor, scaleFactor, scaleFactor);
                exportUSDZ(scene);
            });
        }

        function detectScale(model) {
            const boundingBox = new THREE.Box3().setFromObject(model);
            const size = boundingBox.getSize(new THREE.Vector3());
            return size.y > 1000 ? 0.001 : (size.y > 100 ? 0.01 : 1);
        }

        function exportUSDZ(model) {
            const exporter = new THREE.USDZExporter();
            exporter.parse(model).then(function (arraybuffer) {
                const blob = new Blob([arraybuffer], { type: "model/vnd.usdz+zip" });
                const url = URL.createObjectURL(blob);
                downloadFile(url, 'modelo_convertido.usdz');
            });
        }

        function downloadFile(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
